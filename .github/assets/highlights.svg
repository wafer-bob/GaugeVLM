<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="150" viewBox="0 0 1040 150" role="img" aria-labelledby="title desc"><title id="title">Key results</title><desc id="desc">Compared with GaugeSFT, GaugeVLM improves MSMU distance by 15.0 percentage points and QSpatial+ by 18.9 percentage points on Qwen2.5-VL-7B. All ten spatial metrics improve across each of three backbones.</desc><rect width="1040" height="150" rx="12" fill="#f7f9fc"/><g stroke="#e0e6ef"><path d="M347 27v96M694 27v96"/></g><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><g fill="#466fa8" font-size="40" font-weight="600"><text x="173" y="64">+15.0<tspan font-size="19" font-weight="400"> pp</tspan></text><text x="520" y="64">+18.9<tspan font-size="19" font-weight="400"> pp</tspan></text><text x="866" y="64">30<tspan font-size="23" font-weight="400" fill="#7e8fad"> / 30</tspan></text></g><g fill="#44536b" font-size="17"><text x="173" y="96">MSMU distance</text><text x="520" y="96">QSpatial+</text><text x="866" y="96">Spatial metrics improved</text></g><g fill="#7a8698" font-size="13"><text x="173" y="123">Qwen2.5-VL-7B · vs. GaugeSFT</text><text x="520" y="123">Qwen2.5-VL-7B · vs. GaugeSFT</text><text x="866" y="123">10 metrics × 3 backbones</text></g></g></svg>
